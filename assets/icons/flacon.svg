<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e2a72" />
      <stop offset="100%" stop-color="#121324" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6ca" />
      <stop offset="50%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#9a7a50" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <rect width="400" height="500" fill="#f8f9ff" rx="16"/>
  <circle cx="200" cy="280" r="140" fill="#e0e7ff" opacity="0.45" filter="url(#subtleGlow)"/>

  <!-- Cap Crown (Gold) -->
  <rect x="175" y="75" width="50" height="12" rx="2" fill="url(#goldGrad)" />
  <!-- Cap Body (Deep Indigo & Gold Accent) -->
  <rect x="165" y="87" width="70" height="55" rx="3" fill="url(#indigoGrad)" />
  <line x1="165" y1="115" x2="235" y2="115" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Sprayer Neck (Gold Ring) -->
  <rect x="180" y="142" width="40" height="16" rx="1" fill="url(#goldGrad)" />

  <!-- Flacon Shoulder & Main Glass Body -->
  <path d="M 150 158 L 250 158 C 280 158 295 175 295 205 L 295 400 C 295 412 285 422 272 422 L 128 422 C 115 422 105 412 105 400 L 105 205 C 105 175 120 158 150 158 Z" 
        fill="url(#indigoGrad)" />

  <!-- Glass Inner Glow & Reflection -->
  <path d="M 150 158 L 250 158 C 280 158 295 175 295 205 L 295 400 C 295 412 285 422 272 422 L 128 422 C 115 422 105 412 105 400 L 105 205 C 105 175 120 158 150 158 Z" 
        fill="url(#glassReflection)" />

  <!-- Inner Perfume Liquid Line / Horizon -->
  <rect x="115" y="240" width="170" height="170" rx="4" fill="#312e81" opacity="0.35" />

  <!-- Luxury Minimalist Label -->
  <rect x="140" y="235" width="120" height="110" rx="3" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5" />
  <rect x="144" y="239" width="112" height="102" fill="none" stroke="#e0e7ff" stroke-width="1" />
  
  <!-- Label Typography -->
  <text x="200" y="270" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="16" font-weight="600" letter-spacing="3" fill="#1e1b4b" text-anchor="middle">ORHAN</text>
  <line x1="165" y1="280" x2="235" y2="280" stroke="#c5a880" stroke-width="1" />
  <text x="200" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2" fill="#4338ca" text-anchor="middle">PARFUM</text>
  <text x="200" y="322" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="400" letter-spacing="1.5" fill="#64748b" text-anchor="middle">100 ML · 3.4 FL.OZ</text>

  <!-- Bottom Shadow -->
  <ellipse cx="200" cy="438" rx="85" ry="10" fill="#1e1b4b" opacity="0.12" filter="url(#subtleGlow)" />
</svg>
